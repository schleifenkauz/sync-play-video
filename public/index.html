<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bach Club</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="client.css" />
</head>

<body>
    <div id="stage_preconnect" class="">
        <button id="btn_connect" class="connect-btn circle-button" onclick="connect()">
            Connect
        </button>
    </div>

    <div id="stage_connecting" class="hidden">
        <text class="status-text" id="connecting_msg">
            Connecting...
        </text>
        <div id="download_progress" class="download-progress" role="status" aria-live="polite">
            <progress id="download_progress_bar" max="100" value="0"></progress>
            <span id="download_progress_text">0%</span>
        </div>
    </div>

    <div id="stage_connected" class="hidden">
        <div class="layout">
            <text id="wait_msg" class="status-text">
                Downloading video...
            </text>

            <video id="media" preload="auto" playsinline muted>
            </video>

            <button id="btn_fullscreen" onclick="fullscreen()">
                Enter Fullscreen
            </button>

        </div>
    </div>

    <div id="stage_finished" class="hidden">
        <text class="status-text">
            End of the piece.<br>
            Thank you for participating!
        </text>
    </div>

    <script src="client.js"></script>
</body>

</html>
